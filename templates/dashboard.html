<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sofia · Dashboard de análises</title>
  <style>
    :root{color-scheme:dark;--bg:#101014;--card:#1a1a21;--line:#30303b;--text:#f5f3ef;--muted:#aaa6b2;--lime:#d9ff63;--violet:#a78bfa;--orange:#ff6b35}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:36px 20px 80px}header{padding-bottom:24px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--lime);font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(34px,7vw,72px);line-height:1;margin:10px 0}h2{font-size:24px;margin:0 0 14px}h3{font-size:18px;margin:0 0 10px}.muted,.meta{color:var(--muted)}a{color:var(--violet)}nav{display:flex;gap:8px;overflow:auto;padding:18px 0;position:sticky;top:0;background:rgba(16,16,20,.96);z-index:3}nav a{white-space:nowrap;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 13px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 6;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.wide{grid-column:1/-1}.summary{margin:26px 0}.video{scroll-margin-top:76px;border-top:1px solid var(--line);padding-top:30px;margin-top:38px}.video-head{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.score{font-size:42px;font-weight:900;color:var(--lime)}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px}th{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.frame img{display:block;width:100%;border-radius:10px;border:1px solid var(--line)}.frame figcaption{color:var(--muted);font-size:12px;margin-top:5px}.timeline,.script,.comments{display:grid;gap:10px}.moment,.line,.comment{background:#131318;border:1px solid var(--line);border-radius:10px;padding:13px}.time{color:var(--violet);font-weight:800}.quote{border-left:3px solid var(--lime);padding-left:12px;margin-bottom:6px}.tag{display:inline-block;border:1px solid #4a4659;border-radius:999px;padding:2px 7px;margin:2px;font-size:11px;color:var(--violet)}.warning{border-left:3px solid var(--orange)}@media(max-width:760px){.card{grid-column:1/-1}.video-head{display:block}}
  </style>
</head>
<body><main class="wrap">
  <header><div class="eyebrow">Sofia · análise visual</div><h1>Dashboard de vídeos</h1><p class="meta" id="meta"></p></header>
  <nav id="nav"></nav>
  <section class="summary grid" id="summary"></section>
  <div id="videos"></div>
</main>

<!-- A Sofia substitui TODO o conteúdo deste bloco pelo lote atual ou pelo acervo acumulado. -->
<script id="sofia-data" type="application/json">
[
  {
    "id":"exemplo-1","titulo":"Exemplo 1","criador":"@criador","plataforma":"TikTok","url":"https://example.com/video-1","duracao":"00:30","rota":"A","metricas":{"views":1000,"curtidas":100,"comentarios":10,"compartilhamentos":5},"hook":{"nota":8,"texto":"Abertura do exemplo","analise":"Promete uma resposta clara sem entregar tudo."},"diagnostico":"Tema conhecido com uma tensão fácil de entender.","formato":"Palestrinha","estrutura":"IHC","variavelPrincipal":"Abertura específica","quadros":[],"linhaDoTempo":[],"imagemFala":"Imagem e fala se reforçam.","edicao":"Cortes acompanham as mudanças de ideia.","roteiro":[],"comentarios":[],"aprendizados":["Entre rápido no conflito."],"limitacoes":[]
  },
  {
    "id":"exemplo-2","titulo":"Exemplo 2","criador":"@criador","plataforma":"Instagram","url":"https://example.com/video-2","duracao":"00:42","rota":"D","metricas":{"views":800,"curtidas":48,"comentarios":6,"compartilhamentos":2},"hook":{"nota":6,"texto":"Outra abertura","analise":"O assunto aparece, mas a tensão demora."},"diagnostico":"Boa ideia com começo genérico.","formato":"Lo-Fi","estrutura":"AIDA","variavelPrincipal":"Clareza da promessa","quadros":[],"linhaDoTempo":[],"imagemFala":"Só a capa foi confirmada.","edicao":"Não confirmada visualmente.","roteiro":[],"comentarios":[],"aprendizados":["Dizer o conflito na primeira frase."],"limitacoes":["Os quadros do meio não estavam acessíveis."]
  }
]
</script>
<script>
  const data=JSON.parse(document.getElementById('sofia-data').textContent);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const n=v=>Number(v||0).toLocaleString('pt-BR');
  const rate=v=>v.metricas?.views?((Number(v.metricas.curtidas||0)/Number(v.metricas.views))*100).toFixed(2)+'%':'—';
  document.getElementById('meta').textContent=`${data.length} vídeo${data.length===1?'':'s'} · dashboard único`;
  document.getElementById('nav').innerHTML=data.map((v,i)=>`<a href="#${esc(v.id||'video-'+i)}">${i+1}. ${esc(v.titulo)}</a>`).join('');
  const best=[...data].sort((a,b)=>(b.hook?.nota||0)-(a.hook?.nota||0))[0];
  document.getElementById('summary').innerHTML=`
    <article class="card"><h2>Visão geral</h2><p>${data.length===1?'Uma análise completa.':'Comparação de '+data.length+' vídeos no mesmo lote.'}</p><p><strong>Melhor abertura:</strong> ${esc(best?.titulo)} (${esc(best?.hook?.nota)}/10)</p></article>
    <article class="card"><h2>Principal diferença</h2><p>${esc(data.map(v=>v.variavelPrincipal).filter(Boolean).join(' · ')||'Preencher após comparar o lote.')}</p></article>
    <article class="card wide table-wrap"><h2>Métricas lado a lado</h2><table><thead><tr><th>Vídeo</th><th>Views</th><th>Curtidas</th><th>Comentários</th><th>Compart.</th><th>Curtidas/views</th><th>Abertura</th></tr></thead><tbody>${data.map(v=>`<tr><td>${esc(v.titulo)}</td><td>${n(v.metricas?.views)}</td><td>${n(v.metricas?.curtidas)}</td><td>${n(v.metricas?.comentarios)}</td><td>${n(v.metricas?.compartilhamentos)}</td><td>${rate(v)}</td><td>${esc(v.hook?.nota)}/10</td></tr>`).join('')}</tbody></table></article>`;
  document.getElementById('videos').innerHTML=data.map((v,i)=>`
    <section class="video" id="${esc(v.id||'video-'+i)}">
      <div class="video-head"><div><div class="eyebrow">${esc(v.plataforma)} · rota ${esc(v.rota)}</div><h2>${i+1}. ${esc(v.titulo)}</h2><div class="meta">${esc(v.criador)} · ${esc(v.duracao)} · <a href="${esc(v.url)}" target="_blank" rel="noreferrer">vídeo original</a></div></div><div class="score">${esc(v.hook?.nota)}/10</div></div>
      <div class="grid">
        <article class="card"><h3>Diagnóstico</h3><p>${esc(v.diagnostico)}</p><p class="muted">${esc(v.formato)} · ${esc(v.estrutura)}</p></article>
        <article class="card"><h3>Abertura</h3><p class="quote">${esc(v.hook?.texto)}</p><p>${esc(v.hook?.analise)}</p></article>
        ${v.quadros?.length?`<article class="card wide"><h3>Evidências visuais</h3><div class="frames">${v.quadros.map(q=>`<figure class="frame"><img src="${esc(q.src)}" alt="Quadro em ${esc(q.tempo)}"><figcaption>${esc(q.tempo)} · ${esc(q.descricao)}</figcaption></figure>`).join('')}</div></article>`:''}
        ${v.linhaDoTempo?.length?`<article class="card wide"><h3>Linha do tempo</h3><div class="timeline">${v.linhaDoTempo.map(m=>`<div class="moment"><span class="time">${esc(m.tempo)}</span> ${esc(m.descricao)}</div>`).join('')}</div></article>`:''}
        <article class="card"><h3>Imagem + fala</h3><p>${esc(v.imagemFala)}</p></article><article class="card"><h3>Edição e formato</h3><p>${esc(v.edicao)}</p></article>
        <article class="card wide"><h3>Roteiro anotado</h3><div class="script">${(v.roteiro||[]).map(r=>`<div class="line"><div>${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="quote">${esc(r.frase)}</p><p class="muted">${esc(r.analise)}</p></div>`).join('')||'<p class="muted">Roteiro indisponível.</p>'}</div></article>
        <article class="card"><h3>Comentários</h3><div class="comments">${(v.comentarios||[]).map(c=>`<div class="comment"><strong>${esc(c.autor)}</strong> · ${n(c.curtidas)}<p>${esc(c.texto)}</p><p class="muted">${esc(c.insight)}</p></div>`).join('')||'<p class="muted">Comentários indisponíveis.</p>'}</div></article>
        <article class="card"><h3>O que aprender</h3><ul>${(v.aprendizados||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>
        <article class="card wide warning"><h3>Limitações</h3><ul>${(v.limitacoes||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Nenhuma limitação material registrada.</li>'}</ul></article>
      </div>
    </section>`).join('');
</script>
</body></html>
